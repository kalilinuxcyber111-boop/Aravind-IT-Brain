<!DOCTYPE html>
<!-- Aravind IT Brain - open source, MIT License -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Aravind IT Brain</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#14181f;--mut:#667085;--acc:#2563eb;--accT:#fff;--bd:#e3e6ec;--me:#2563eb;--meT:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#1a1f2a;--txt:#e8ebf1;--mut:#98a2b3;--acc:#5b8def;--bd:#2a3140;--me:#3b6fe0;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:12px 14px 6px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.hb{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:8px;padding:6px 10px;font-size:12px}
.hb.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 10px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
#log{flex:1;overflow-y:auto;padding:4px 14px 10px;display:flex;flex-direction:column;gap:10px}
.m{max-width:94%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--me);color:var(--meT);border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.ai pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;overflow-x:auto;margin:6px 0;white-space:pre}
.ai code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:13px}
.ai pre code{background:none;padding:0}
.src{margin-top:8px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.src a{color:var(--acc);text-decoration:none;overflow-wrap:anywhere}
.tools{margin-top:6px}
.tools button{background:none;border:none;color:var(--acc);font-size:12px;padding:2px 10px 2px 0}
.hint{color:var(--mut);text-align:center;margin:auto;padding:20px;font-size:14px}
.hint b{display:block;font-size:16px;color:var(--txt);margin-bottom:6px}
#pv{display:flex;gap:8px;padding:6px 14px;border-top:1px solid var(--bd);overflow-x:auto}
#pv[hidden]{display:none}
#pv img{height:56px;border-radius:8px;flex:none}
#pv span{flex:none;align-self:center;color:var(--mut);font-size:12px}
#bar{display:flex;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--bd);background:var(--bg)}
textarea{flex:1;min-width:0;resize:none;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:12px;padding:10px 12px;font:inherit;max-height:120px}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:12px;padding:0 10px}
.ib.on{background:var(--acc);color:var(--accT)}
.ib.rec{background:#dc2626;color:#fff}
#send{border:none;border-radius:12px;padding:0 16px;background:var(--acc);color:var(--accT);font-weight:600}
#send:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <h1>Aravind IT Brain<small>Desktop support &amp; IT engineer assistant</small></h1>
  <span><button id="aud" class="hb">🔈 Auto</button> <button id="clr" class="hb">New chat</button></span>
</header>
<div id="chips"></div>
<div id="log"></div>
<div id="pv" hidden></div>
<div id="bar">
  <button id="att" class="ib" aria-label="Photos">📷</button>
  <input id="pic" type="file" accept="image/*" multiple hidden>
  <button id="deep" class="ib" aria-label="Deep + web search" title="Deep analysis + live web search">🔬</button>
  <button id="mic" class="ib" aria-label="Voice" hidden>🎤</button>
  <textarea id="in" rows="1" placeholder="Issue, error, ticket details…"></textarea>
  <button id="send">Send</button>
</div>
<script>
const MODES={fix:"🔧 Troubleshoot",ticket:"📝 Ticket note",reply:"✉️ Reply to user",cmd:"💻 Commands",plan:"📋 Day plan",ask:"🧠 Just ask"};
const MAX_PICS=50, MAX_BYTES=4.0*1024*1024; // Vercel request limit is ~4.5 MB
let mode="fix",hist=[],pics=[],busy=false,deep=false,auto=false,spBtn=null;
const $=id=>document.getElementById(id),log=$("log"),inp=$("in");
try{hist=JSON.parse(localStorage.getItem("itb")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("itb",JSON.stringify(hist.slice(-40)))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const md=t=>esc(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,"<pre><code>$1</code></pre>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");

function chips(){$("chips").innerHTML="";for(const k in MODES){const b=document.createElement("button");b.className="chip"+(k===mode?" on":"");b.textContent=MODES[k];b.onclick=()=>{mode=k;chips()};$("chips").appendChild(b)}}

function add(role,text,src){
  const d=document.createElement("div");d.className="m "+(role==="user"?"me":"ai");
  if(role==="user"){d.textContent=text;log.appendChild(d)}
  else{const body=document.createElement("div");body.innerHTML=md(text);d.appendChild(body);setSrc(d,src);tools(d,body);log.appendChild(d)}
  log.scrollTop=log.scrollHeight;return d;
}
function setSrc(d,src){if(!src||!src.length)return;const s=document.createElement("div");s.className="src";s.append("Sources:");src.forEach(x=>{const a=document.createElement("a");a.href=x.uri;a.target="_blank";a.rel="noopener";a.textContent="↗ "+x.title;s.appendChild(a)});d.insertBefore(s,d.querySelector(".tools"))}
function tools(d,body){
  const t=document.createElement("div");t.className="tools";
  const c=document.createElement("button");c.textContent="Copy";
  c.onclick=async()=>{try{await navigator.clipboard.writeText(body.innerText);c.textContent="Copied ✓"}catch(e){c.textContent="Long-press to copy"}};
  const s=document.createElement("button");s.textContent="🔊 Speak";s.onclick=()=>speak(body.innerText,s);
  t.append(c,s);d.appendChild(t);
}
function render(){log.innerHTML="";if(!hist.length){log.innerHTML='<div class="hint"><b>Work-ku unga brain 🧠</b>Pick a mode, then type the issue, error message, or attach screenshots (up to 50).<br>🔬 = deep analysis + live web search.</div>';return}
  hist.forEach(m=>add(m.role,m.content,m.src))}

function speak(t,b){try{const s=window.speechSynthesis;if(spBtn)spBtn.textContent="🔊 Speak";const was=b&&b===spBtn&&s.speaking;s.cancel();spBtn=null;if(was)return;
  const u=new SpeechSynthesisUtterance(t.replace(/[`*#_]/g,""));u.lang=/[\u0B80-\u0BFF]/.test(t)?"ta-IN":"en-IN";
  u.onend=()=>{if(b)b.textContent="🔊 Speak";spBtn=null};if(b){b.textContent="⏹ Stop";spBtn=b}s.speak(u)}catch(e){}}

async function go(){
  const text=inp.value.trim()||(pics.length?"Indha screenshot-la irukka issue-ku reason-um fix-um sollunga.":"");
  if(!text||busy)return;
  busy=true;$("send").disabled=true;inp.value="";inp.style.height="auto";
  const imgs=pics.map(p=>p.b64),label=imgs.length?"📷×"+imgs.length+" ":"";pics=[];showPics();
  if(!hist.length)log.innerHTML="";
  hist.push({role:"user",content:label+text});add("user",label+text);
  const out=add("assistant","Thinking…");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json","x-app-password":localStorage.getItem("pw")||""},
      body:JSON.stringify({messages:hist.map(m=>({role:m.role,content:m.content})),images:imgs,deep,mode})});
    const data=await r.json().catch(()=>({error:"Bad response ("+r.status+")"}));
    if(r.status===401){const p=prompt("Password?");if(p){localStorage.setItem("pw",p)}throw new Error("Password kudutheengaa — marubadi Send pannunga.")}
    if(r.status===413)throw new Error("Photos romba periya size — kuraivaa photos anuppunga.");
    if(!r.ok)throw new Error(data.error||"Error "+r.status);
    out.remove();hist.push({role:"assistant",content:data.text,src:data.sources});save();
    add("assistant",data.text,data.sources);if(auto)speak(data.text);
  }catch(e){out.firstChild.textContent=e.message;hist.pop()}
  busy=false;$("send").disabled=false;
}

function showPics(){const p=$("pv");p.innerHTML="";p.hidden=!pics.length;if(!pics.length)return;
  const c=document.createElement("span");c.textContent=pics.length+"/"+MAX_PICS;p.appendChild(c);
  pics.forEach((x,i)=>{const im=document.createElement("img");im.src=x.url;im.title="Tap to remove";im.onclick=()=>{pics.splice(i,1);showPics()};p.appendChild(im)})}
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.6))};
  im.onerror=rej;im.src=u})}
$("pic").onchange=async e=>{
  const fs=[...e.target.files].slice(0,MAX_PICS-pics.length);e.target.value="";
  let total=pics.reduce((a,p)=>a+p.b64.length*.75,0),skipped=0;
  for(const f of fs){try{const url=await shrink(f),b64=url.split(",")[1];
    if(total+b64.length*.75>MAX_BYTES){skipped++;continue}total+=b64.length*.75;pics.push({url,b64})}catch(x){}}
  showPics();if(skipped)alert(skipped+" photo(s) add aagala — size limit (~4 MB). Kuraivaa photos anuppunga.");
};

$("att").onclick=()=>$("pic").click();
$("deep").onclick=()=>{deep=!deep;$("deep").classList.toggle("on",deep)};
$("aud").onclick=()=>{auto=!auto;$("aud").classList.toggle("on",auto);if(!auto)try{speechSynthesis.cancel()}catch(e){}};
$("clr").onclick=()=>{hist=[];save();render()};
$("send").onclick=go;
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,120)+"px"});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const m=$("mic");m.hidden=false;let rec=null;
  m.onclick=()=>{if(rec){rec.stop();return}rec=new SR();rec.lang="en-IN";rec.interimResults=false;
    rec.onresult=e=>{inp.value=(inp.value+" "+e.results[0][0].transcript).trim()};
    rec.onend=()=>{rec=null;m.classList.remove("rec")};rec.onerror=()=>{rec=null;m.classList.remove("rec")};
    m.classList.add("rec");rec.start()}}

chips();render();
</script>
</body>
</html>
